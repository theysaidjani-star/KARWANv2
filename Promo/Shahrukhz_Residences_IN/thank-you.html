<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#092f3a" />
    <title>Thank You | Karwan Properties</title>
    <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/fav-white.svg" type="image/webp">

    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #092f3a;
        color: #f8f5ef;
      }
      .thanks {
        width: min(680px, calc(100% - 32px));
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid rgba(211, 177, 112, 0.4);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }
      .thanks .tick {
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        width: 64px;
        height: 64px;
        border: 1px solid #c9a96e;
        border-radius: 50%;
        color: #c9a96e;
        font-size: 2rem;
      }
      .thanks h1 {
        font-size: clamp(2.2rem, 6vw, 4.5rem);
        margin-bottom: 16px;
      }
      .thanks p {
        line-height: 1.7;
        opacity: 0.82;
        margin: 0 auto 26px;
        max-width: 48ch;
      }
      .thanks a {
        display: inline-block;
        padding: 14px 22px;
        background: #c9a96e;
        color: #092f3a;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="thanks">
      <div class="tick" aria-hidden="true">✓</div>
      <h1>Thank you for your enquiry.</h1>
      <p>
        Your request has been received. Our property team will review your
        preferences and get in touch about Shahrukhz Residences by Danube.
      </p>
      <a href="index.html">Back to the project</a>
    </main>
  </body>
</html>
